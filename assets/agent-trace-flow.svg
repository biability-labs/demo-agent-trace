<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Agent Trace change attribution flow</title>
  <desc id="desc">Two flows: a person changes and commits code, while Codex captures changes before and after a turn to associate them with a session.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 28px system-ui, sans-serif; fill: #0f172a; }
      .lane { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .label { font: 600 15px system-ui, sans-serif; fill: #0f172a; }
      .small { font: 13px system-ui, sans-serif; fill: #334155; }
      .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 13; }
      .manual { fill: #eff6ff; stroke: #60a5fa; }
      .codex { fill: #f5f3ff; stroke: #a78bfa; }
      .trace { fill: #ecfdf5; stroke: #34d399; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">What happens when code changes</text>

  <rect x="40" y="85" width="1120" height="230" rx="18" fill="#f8fbff" stroke="#bfdbfe"/>
  <text x="70" y="120" class="lane">Manual edit</text>
  <rect x="75" y="155" width="180" height="92" class="box manual"/>
  <text x="165" y="192" text-anchor="middle" class="label">Person edits</text><text x="165" y="215" text-anchor="middle" class="small">src/calc.py</text>
  <path d="M255 201 H335" class="arrow"/>
  <rect x="350" y="155" width="190" height="92" class="box manual"/>
  <text x="445" y="192" text-anchor="middle" class="label">git add + commit</text><text x="445" y="215" text-anchor="middle" class="small">change committed</text>
  <path d="M540 201 H620" class="arrow"/>
  <rect x="635" y="155" width="205" height="92" class="box trace"/>
  <text x="738" y="192" text-anchor="middle" class="label">post-commit hook</text><text x="738" y="215" text-anchor="middle" class="small">trace_commit.py</text>
  <path d="M840 201 H920" class="arrow"/>
  <rect x="935" y="155" width="185" height="92" class="box trace"/>
  <text x="1028" y="192" text-anchor="middle" class="label">Final trace</text><text x="1028" y="215" text-anchor="middle" class="small">attribution: human</text>

  <rect x="40" y="355" width="1120" height="290" rx="18" fill="#fcfbff" stroke="#ddd6fe"/>
  <text x="70" y="390" class="lane">Codex edit</text>
  <rect x="70" y="430" width="170" height="105" class="box codex"/>
  <text x="155" y="466" text-anchor="middle" class="label">UserPromptSubmit</text><text x="155" y="489" text-anchor="middle" class="small">before hook</text><text x="155" y="510" text-anchor="middle" class="small">initial snapshot</text>
  <path d="M240 482 H300" class="arrow"/>
  <rect x="315" y="430" width="170" height="105" class="box codex"/>
  <text x="400" y="466" text-anchor="middle" class="label">Codex edits</text><text x="400" y="489" text-anchor="middle" class="small">code + session</text>
  <path d="M485 482 H545" class="arrow"/>
  <rect x="560" y="430" width="170" height="105" class="box codex"/>
  <text x="645" y="466" text-anchor="middle" class="label">Stop</text><text x="645" y="489" text-anchor="middle" class="small">after hook</text><text x="645" y="510" text-anchor="middle" class="small">compares snapshots</text>
  <path d="M730 482 H790" class="arrow"/>
  <rect x="805" y="430" width="165" height="105" class="box codex"/>
  <text x="888" y="466" text-anchor="middle" class="label">Pending</text><text x="888" y="489" text-anchor="middle" class="small">lines + model</text><text x="888" y="510" text-anchor="middle" class="small">+ session_id</text>
  <path d="M970 482 H1030" class="arrow"/>
  <rect x="1045" y="430" width="75" height="105" class="box trace"/>
  <text x="1083" y="474" text-anchor="middle" class="label">Commit</text><text x="1083" y="500" text-anchor="middle" class="small">→ ai</text>
  <path d="M1083 535 V585 H970" class="arrow"/>
  <rect x="740" y="555" width="215" height="60" class="box trace"/>
  <text x="848" y="582" text-anchor="middle" class="label">Trace with Codex session</text><text x="848" y="603" text-anchor="middle" class="small">.agent_trace/traces/*.json</text>
</svg>
